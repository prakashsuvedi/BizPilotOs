<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" width="100%" height="100%">
  <defs>
    <!-- Dark Atmospheric Background Radial Halos -->
    <radialGradient id="darkBgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070814" stop-opacity="1" />
    </radialGradient>

    <!-- Metallic Rim & Faces for 3D 'M' -->
    <linearGradient id="mGrad1Dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="mGrad2Dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="silverFaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Spark Glow -->
    <radialGradient id="sparkGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- OS Pill Metallic Gradient -->
    <linearGradient id="osPillDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="brandTextDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#38bdf8" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="10" stdDeviation="25" flood-color="#1d4ed8" flood-opacity="0.4" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="820" fill="url(#darkBgGlow)" rx="28" />

  <!-- TOP EMBLEM LOGO MARK -->
  <g transform="translate(500, 230)">
    <!-- Globe & Constellation Network Backing -->
    <g opacity="0.45" stroke="#38bdf8" stroke-width="1.8" fill="none">
      <circle cx="0" cy="-30" r="150" stroke-dasharray="6 6" filter="url(#neonGlow)" />
      <ellipse cx="0" cy="-30" rx="150" ry="60" />
      <ellipse cx="0" cy="-30" rx="70" ry="150" />
      <line x1="-150" y1="-30" x2="150" y2="-30" />
      
      <!-- Network Nodes -->
      <circle cx="-85" cy="-70" r="6" fill="#38bdf8" />
      <circle cx="85" cy="-70" r="6" fill="#38bdf8" />
      <circle cx="0" cy="-130" r="7" fill="#60a5fa" />
      <circle cx="-130" cy="10" r="5" fill="#a855f7" />
      <circle cx="130" cy="10" r="5" fill="#a855f7" />
      <line x1="-85" y1="-70" x2="0" y2="-130" stroke="#38bdf8" stroke-width="2" />
      <line x1="0" y1="-130" x2="85" y2="-70" stroke="#38bdf8" stroke-width="2" />
    </g>

    <!-- Financial Growth Bar Chart Background -->
    <g transform="translate(-40, -110)" opacity="0.8">
      <rect x="20" y="20" width="16" height="50" rx="3" fill="#0284c7" />
      <rect x="42" y="-5" width="16" height="75" rx="3" fill="#0369a1" />
      <rect x="64" y="-35" width="16" height="105" rx="3" fill="#38bdf8" />
      <rect x="86" y="-65" width="16" height="135" rx="3" fill="#60a5fa" />
    </g>

    <!-- Metallic 3D Letter 'M' -->
    <g transform="scale(1.25) translate(0, -15)">
      <!-- Left Stem -->
      <path d="M -130 110 L -130 -80 L -80 -120 L -30 10 L -70 110 Z" fill="url(#mGrad2Dark)" />
      <path d="M -115 100 L -115 -70 L -80 -105 L -45 0 L -75 100 Z" fill="url(#mGrad1Dark)" />

      <!-- Center Silver V -->
      <path d="M -30 10 L 0 100 L 30 10 L 0 110 Z" fill="url(#mGrad2Dark)" />
      <path d="M -20 15 L 0 85 L 20 15 Z" fill="url(#silverFaceGrad)" />

      <!-- Right Stem -->
      <path d="M 30 10 L 80 -120 L 130 -80 L 130 110 L 70 110 Z" fill="url(#mGrad2Dark)" />
      <path d="M 45 0 L 80 -105 L 115 -70 L 115 100 L 75 100 Z" fill="url(#mGrad1Dark)" />
    </g>

    <!-- Growth Arrow Swoosh -->
    <path d="M -125 100 C -70 80, 40 0, 180 -130 L 135 -130 L 210 -160 L 195 -85 L 165 -115 C 40 0, -70 80, -125 100 Z" fill="url(#arrowGradDark)" filter="url(#neonGlow)" />

    <!-- Anvil & Blacksmith Hammer Impact -->
    <g transform="translate(0, 65)">
      <!-- Anvil Base -->
      <path d="M -55 45 L 55 45 L 45 10 L 65 0 L 65 -12 L -65 -12 L -65 0 L -45 10 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#badgeGlow)" />
      <path d="M -60 -10 L 60 -10 L 52 0 L -52 0 Z" fill="#f8fafc" />

      <!-- Heavy Hammer -->
      <g transform="translate(0, -32) rotate(-28)">
        <rect x="-7" y="-32" width="14" height="44" rx="3" fill="#78350f" />
        <rect x="-20" y="-48" width="40" height="22" rx="5" fill="#475569" stroke="#ffffff" stroke-width="2" />
      </g>

      <!-- Impact Sparks -->
      <circle cx="0" cy="-12" r="35" fill="url(#sparkGlowDark)" />
      <line x1="0" y1="-12" x2="-40" y2="-50" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round" />
      <line x1="0" y1="-12" x2="40" y2="-50" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round" />
      <line x1="0" y1="-12" x2="-52" y2="-22" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
      <line x1="0" y1="-12" x2="52" y2="-22" stroke="#f97316" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <!-- BRAND NAME TYPOGRAPHY -->
  <g transform="translate(500, 520)">
    <text text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="88" letter-spacing="-1.5" filter="url(#neonGlow)">
      <tspan fill="#38bdf8">Market</tspan><tspan fill="#60a5fa">Forge</tspan>
    </text>

    <!-- OS Pill Box -->
    <g transform="translate(300, -74)">
      <rect x="0" y="0" width="140" height="76" rx="24" fill="url(#osPillDark)" stroke="#38bdf8" stroke-width="3.5" filter="url(#neonGlow)" />
      <text x="70" y="54" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">OS</text>
      <text x="130" y="24" font-family="sans-serif" font-weight="bold" font-size="16" fill="#93c5fd">TM</text>
    </g>
  </g>

  <!-- TAGLINE WITH ACCENT DIVIDERS -->
  <g transform="translate(500, 595)">
    <line x1="-420" y1="-6" x2="-250" y2="-6" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#f8fafc" letter-spacing="7" text-anchor="middle" filter="url(#badgeGlow)">
      A TRUE BUSINESS TRANSFORMATION
    </text>
    <line x1="250" y1="-6" x2="420" y2="-6" stroke="#38bdf8" stroke-width="2" opacity="0.7" />
  </g>

  <!-- 7 FEATURE CAPABILITY BADGES -->
  <g transform="translate(500, 710)">
    <!-- Pipeline Connecting Line -->
    <line x1="-410" y1="0" x2="410" y2="0" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" />

    <!-- Badge 1: CRM & CUSTOMERS -->
    <g transform="translate(-410, 0)">
      <circle cx="0" cy="0" r="28" fill="#9333ea" stroke="#a855f7" stroke-width="2.5" filter="url(#badgeGlow)" />
      <path d="M -10 8 C -10 1, 10 1, 10 8 M 0 -8 A 5 5 0 1 0 0 -18 A 5 5 0 1 0 0 -8" stroke="#ffffff" stroke-width="2.5" fill="none" />
      <text x="0" y="46" font-family="sans-serif" font-weight="800" font-size="11" fill="#e2e8f0" text-anchor="middle">CRM &amp; CUSTOMERS</text>
    </g>

    <!-- Badge 2: SALES & MARKETING -->
    <g transform="translate(-273, 0)">
      <circle cx="0" cy="0" r="28" fill="#0284c7" stroke="#38bdf8" stroke-width="2.5" filter="url(#badgeGlow)" />
      <path d="M -12 10 L -3 0 L 4 6 L 14 -8 M 7 -8 L 14 -8 L 14 -1" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="0" y="46" font-family="sans-serif" font-weight="800" font-size="11" fill="#e2e8f0" text-anchor="middle">SALES &amp; MARKETING</text>
    </g>

    <!-- Badge 3: AI INSIGHTS -->
    <g transform="translate(-136, 0)">
      <circle cx="0" cy="0" r="28" fill="#0d9488" stroke="#14b8a6" stroke-width="2.5" filter="url(#badgeGlow)" />
      <circle cx="0" cy="0" r="10" stroke="#ffffff" stroke-width="2.5" fill="none" />
      <path d="M 0 -15 L 0 -10 M 0 10 L 0 15 M -15 0 L -10 0 M 10 0 L 15 0" stroke="#ffffff" stroke-width="2.5" />
      <text x="0" y="46" font-family="sans-serif" font-weight="800" font-size="11" fill="#e2e8f0" text-anchor="middle">AI INSIGHTS</text>
    </g>

    <!-- Badge 4: AUTOMATION -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="28" fill="#ea580c" stroke="#f97316" stroke-width="2.5" filter="url(#badgeGlow)" />
      <path d="M -9 -5 A 6 6 0 0 1 4 -5 L 9 0 A 6 6 0 0 1 -4 0 Z" stroke="#ffffff" stroke-width="2.5" fill="none" />
      <text x="0" y="46" font-family="sans-serif" font-weight="800" font-size="11" fill="#e2e8f0" text-anchor="middle">AUTOMATION</text>
    </g>

    <!-- Badge 5: BUSINESS INTELLIGENCE -->
    <g transform="translate(136, 0)">
      <circle cx="0" cy="0" r="28" fill="#c026d3" stroke="#e879f9" stroke-width="2.5" filter="url(#badgeGlow)" />
      <ellipse cx="0" cy="-7" rx="11" ry="5" stroke="#ffffff" stroke-width="2" fill="none" />
      <ellipse cx="0" cy="0" rx="11" ry="5" stroke="#ffffff" stroke-width="2" fill="none" />
      <ellipse cx="0" cy="7" rx="11" ry="5" stroke="#ffffff" stroke-width="2" fill="none" />
      <text x="0" y="46" font-family="sans-serif" font-weight="800" font-size="11" fill="#e2e8f0" text-anchor="middle">BUSINESS INTEL</text>
    </g>

    <!-- Badge 6: SECURITY & TRUST -->
    <g transform="translate(273, 0)">
      <circle cx="0" cy="0" r="28" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2.5" filter="url(#badgeGlow)" />
      <path d="M 0 -12 L 10 -7 L 10 2 C 10 9 0 14 0 14 C 0 14 -10 9 -10 2 L -10 -7 Z" stroke="#ffffff" stroke-width="2.5" fill="none" />
      <text x="0" y="46" font-family="sans-serif" font-weight="800" font-size="11" fill="#e2e8f0" text-anchor="middle">SECURITY &amp; TRUST</text>
    </g>

    <!-- Badge 7: GLOBAL GROWTH -->
    <g transform="translate(410, 0)">
      <circle cx="0" cy="0" r="28" fill="#16a34a" stroke="#4ade80" stroke-width="2.5" filter="url(#badgeGlow)" />
      <circle cx="0" cy="0" r="12" stroke="#ffffff" stroke-width="2.5" fill="none" />
      <ellipse cx="0" cy="0" rx="5" ry="12" stroke="#ffffff" stroke-width="2" fill="none" />
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="46" font-family="sans-serif" font-weight="800" font-size="11" fill="#e2e8f0" text-anchor="middle">GLOBAL GROWTH</text>
    </g>
  </g>
</svg>
