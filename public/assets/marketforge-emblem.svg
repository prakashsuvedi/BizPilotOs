<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Metallic Rim Gradient -->
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#93c5fd" />
      <stop offset="75%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Inner Glow Ring -->
    <radialGradient id="cyanGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <!-- M Metallic Face Gradient -->
    <linearGradient id="mGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="mGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Spark Glow -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#dc2626" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- OS Pill Metallic -->
    <linearGradient id="osPillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Filter Drop Shadow & Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="sparkFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Frame -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGlow)" stroke="url(#metalRim)" stroke-width="12" filter="url(#neonGlow)" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.8" />
  <circle cx="250" cy="250" r="218" fill="url(#cyanGlow)" />

  <!-- Globe & Constellation Nodes Background -->
  <g opacity="0.35" stroke="#38bdf8" stroke-width="1" fill="none">
    <circle cx="250" cy="160" r="110" stroke-dasharray="4 4" />
    <ellipse cx="250" cy="160" rx="110" ry="45" />
    <ellipse cx="250" cy="160" rx="50" ry="110" />
    <line x1="140" y1="160" x2="360" y2="160" />
    <!-- Node Dots -->
    <circle cx="190" cy="130" r="4" fill="#38bdf8" />
    <circle cx="310" cy="130" r="4" fill="#38bdf8" />
    <circle cx="250" cy="90" r="5" fill="#60a5fa" />
    <circle cx="280" cy="190" r="4" fill="#38bdf8" />
    <circle cx="210" cy="180" r="4" fill="#38bdf8" />
    <line x1="190" y1="130" x2="250" y2="90" stroke="#a5f3fc" stroke-width="1.5" />
    <line x1="250" y1="90" x2="310" y2="130" stroke="#a5f3fc" stroke-width="1.5" />
    <line x1="310" y1="130" x2="280" y2="190" stroke="#a5f3fc" stroke-width="1.5" />
  </g>

  <!-- Metallic 3D Letter 'M' Body -->
  <g>
    <!-- Left Stem M -->
    <path d="M 105 340 L 105 160 L 150 120 L 195 240 L 160 340 Z" fill="url(#mGrad2)" />
    <path d="M 120 330 L 120 170 L 150 135 L 180 230 L 155 330 Z" fill="url(#mGrad1)" />

    <!-- Center V Stem M -->
    <path d="M 195 240 L 250 330 L 305 240 L 270 340 L 230 340 Z" fill="url(#mGrad2)" />

    <!-- Right Stem M -->
    <path d="M 305 240 L 350 120 L 395 160 L 395 340 L 340 340 Z" fill="url(#mGrad2)" />
    <path d="M 320 230 L 350 135 L 380 170 L 380 330 L 345 330 Z" fill="url(#mGrad1)" />

    <!-- 3D Bevel Highlight Overlays -->
    <path d="M 105 160 L 150 120 L 150 135 L 120 170 Z" fill="#ffffff" opacity="0.6" />
    <path d="M 395 160 L 350 120 L 350 135 L 380 170 Z" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Growth Arrow Swoosh -->
  <g filter="url(#neonGlow)">
    <path d="M 140 330 C 180 310, 280 240, 390 120 L 350 120 L 415 95 L 405 165 L 375 135 C 270 240, 180 295, 140 330 Z" fill="url(#arrowGrad)" />
  </g>

  <!-- Blacksmith Anvil & Hammer (MarketForge Central Symbol) -->
  <g>
    <!-- Anvil Base -->
    <path d="M 205 325 L 295 325 L 285 300 L 310 290 L 310 280 L 190 280 L 190 290 L 215 300 Z" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M 195 282 L 305 282 L 300 290 L 200 290 Z" fill="#cbd5e1" opacity="0.9" />

    <!-- Blacksmith Hammer -->
    <g transform="translate(250, 255) rotate(-28)">
      <!-- Handle -->
      <rect x="-6" y="-35" width="12" height="45" rx="3" fill="#78350f" stroke="#b45309" stroke-width="1" />
      <!-- Metallic Head -->
      <rect x="-18" y="-48" width="36" height="20" rx="4" fill="#64748b" stroke="#f8fafc" stroke-width="1.5" />
      <rect x="-16" y="-46" width="32" height="8" fill="#94a3b8" />
    </g>

    <!-- Spark Flares & Energy Burst from Anvil Impact -->
    <circle cx="250" cy="275" r="35" fill="url(#sparkGlow)" filter="url(#sparkFilter)" />
    <!-- Individual Flying Sparks -->
    <path d="M 250 275 L 220 240 M 250 275 L 280 235 M 250 275 L 200 260 M 250 275 L 300 260 M 250 275 L 235 220 M 250 275 L 265 220" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" />
    <circle cx="220" cy="240" r="3" fill="#fef08a" />
    <circle cx="280" cy="235" r="3" fill="#fef08a" />
    <circle cx="200" cy="260" r="2.5" fill="#f97316" />
    <circle cx="300" cy="260" r="2.5" fill="#f97316" />
    <circle cx="235" cy="220" r="3" fill="#ffffff" />
    <circle cx="265" cy="220" r="3" fill="#ffffff" />
  </g>

  <!-- Bottom OS Badge Pill -->
  <g transform="translate(180, 395)">
    <rect x="0" y="0" width="140" height="52" rx="26" fill="url(#osPillGrad)" stroke="#38bdf8" stroke-width="4" filter="url(#neonGlow)" />
    <rect x="4" y="4" width="132" height="44" rx="22" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.6" />
    <text x="70" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle" letter-spacing="3">OS</text>
  </g>
</svg>
